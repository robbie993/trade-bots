# The same contract in YAML. `genome:` and `universe:`, nothing computed.
#
# `strategy:` here is a label, not a nested block — both spellings are read.
name: Slow Trend Desk
asset_class: Equities
strategy: trend_following

genome:
  fast_window: 12
  slow_window: 60
  rsi_window: 14
  trend_bias: 70
  value_window: 60
  fair_band_pct: 6
  calm_vol_pct: 30
  # How far a position may fall from what it cost before it is closed without
  # a debate. 0 turns the stop off, which is what every firm did before this
  # gene existed — and is how a village ends up with an average loss eight
  # times its average win.
  stop_loss_pct: 0

universe: [AAPL, MSFT, JNJ, KO]
