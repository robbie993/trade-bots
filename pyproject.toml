[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mvv"
version = "1.0.0"
description = "Minimum Viable Village Phase 1 — the Experiment Ledger"
readme = "README.md"
requires-python = ">=3.10"
# The core loop runs on the standard library alone. Everything else is an
# extra, so the thing that decides whether to spend money has no supply chain.
# requirements.txt installs the full stack from spec section 11.2.
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
# The trading edition reads config/firm_config.yaml. PyYAML is used when it is
# present; without it, src/trading/firms/spec.py parses the subset the file
# actually uses, so adding a firm never requires a dependency.
trading = ["PyYAML>=6.0"]
web = ["fastapi>=0.100.0", "uvicorn>=0.23.0", "pydantic>=2.0.0", "python-multipart>=0.0.6"]
analysis = ["pandas>=2.0.0", "numpy>=1.24.0"]
dev = ["pytest>=7.4", "httpx>=0.24.0"]

[project.scripts]
mvv = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
