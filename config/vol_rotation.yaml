# Ten volatility-rotation firms on 15-minute bars. See bots/vol_rotation/README.md.
#
# This is its own firms file rather than an addition to firm_config.yaml, so
# trying it does not touch the village you already run:
#
#   export TRADE_FIRMS_CONFIG=config/vol_rotation.yaml
#   export TRADE_BAR_TIMEFRAME=15m TRADE_TICK_INTERVAL_S=900
#   export TRADE_HISTORY_DAYS=1500          # bars, not days, once intraday
#   python -m src.main trade init
#   python -m src.main trade backtest
#
# risk_limit caps a single order at that fraction of the allocation. A full
# position is 25% of equity in three tranches, and a volume surge buys two
# tranches (about 17%) in one order, so 0.20 leaves room for that. The
# village-wide TRADE_MAX_POSITION_PCT (25% by default) still caps each name.

firms:
  vr_index_etfs:
    name: "Vol Rotation: Index ETFs"
    asset_class: "Equities"
    venue: "paper"
    risk_limit: 0.20
    capital_allocation: 25000
    universe: [SPY, QQQ, IWM, DIA]
    bot: bots/vol_rotation/01_index_etfs.py

  vr_semiconductors:
