# X accounts the village account follows and reads (scripts/x_watch.py).
#
# The reader reads the Following timeline, so these are the voices the village
# chose, then a few tweets off the For you tab (for_you_tweets, below). Each
# handle is opened before it is followed; one that does not exist or is
# suspended is recorded as missing and skipped. Edit freely.
accounts:
  # fast market news
  - {handle: DeItaone, group: news}          # Walter Bloomberg: headlines as they cross
  - {handle: unusual_whales, group: news}
  - {handle: zerohedge, group: news}
  - {handle: WatcherGuru, group: news}
  - {handle: FirstSquawk, group: news}
  - {handle: Newsquawk, group: news}
  - {handle: business, group: news}          # Bloomberg
  - {handle: CNBC, group: news}
  - {handle: WSJmarkets, group: news}
  - {handle: TheStalwart, group: news}       # Joe Weisenthal
  # traders and analysts
  - {handle: KobeissiLetter, group: trading}
  - {handle: charliebilello, group: trading}
  - {handle: markminervini, group: trading}
  - {handle: MacroCharts, group: trading}
  # crypto
  - {handle: saylor, group: crypto}
  - {handle: APompliano, group: crypto}
  - {handle: CryptoHayes, group: crypto}
  - {handle: cz_binance, group: crypto}
  - {handle: solana, group: crypto}
  # AI agents and the labs building them
  - {handle: AnthropicAI, group: ai}
  - {handle: OpenAI, group: ai}
  - {handle: karpathy, group: ai}
  - {handle: huggingface, group: ai}
  # memes
  - {handle: elonmusk, group: memes}         # moves DOGE when he posts about it
  - {handle: dogecoin, group: memes}

follows_per_run: 4
follow_pause_s: 45

# Tweets read from the Following timeline per run, and how old a call may be.
tweets_per_run: 60
max_age_hours: 24

# The For you tab: what X picks for the account, read after Following. A tweet
# from it is kept only if it is about markets or makes a call. 0 turns it off.
for_you_tweets: 20
