# The firms — section 2.3 of the build document.
#
# Edit this file to add, retire or re-scope a firm, then run:
#   python -m src.main trade init
#
# `init` never re-funds a firm that already exists: capital only moves through
# the brokerage's allocator, and the allocator needs a human to raise it. What
# `init` will update is the mandate — name, universe, analysts, genome.
#
# Every symbol here is resolved through the configured data source. The default
# source is `synthetic`, a seeded random walk, so this file works out of the
# box with no market data subscription. Point TRADE_DATA_SOURCE at `csv` or
# `yahoo` when you want real prices; the symbols below are real tickers so the
# switch needs no other change.

firms:
  firm_a_etf:
    name: "ETF Specialist"
    asset_class: "ETF"
    strategy: "momentum_reversion"
    venue: "paper"
    risk_limit: 0.02          # fraction of allocation risked per new position
    capital_allocation: 100000
    universe: [SPY, QQQ, IWM, DIA, EFA]
    analysts: [fundamental, technical, sentiment, signals, news, scribe]
    genome:
      fast_window: 10
      slow_window: 30
      rsi_window: 14
      trend_bias: 65          # 100 = pure momentum, 0 = pure mean reversion
      value_window: 90
      fair_band_pct: 8
      calm_vol_pct: 35

  firm_b_stocks:
    name: "Stock Picker"
    asset_class: "Equities"
    strategy: "fundamental_momentum"
    risk_limit: 0.03
    capital_allocation: 100000
    universe: [AAPL, MSFT, NVDA, JNJ, XOM, KO]
    analysts: [fundamental, technical, sentiment]
    genome:
      fast_window: 12
      slow_window: 40
      rsi_window: 14
      trend_bias: 55
      value_window: 120
      fair_band_pct: 10
      calm_vol_pct: 30

  firm_c_crypto:
    name: "Crypto Trader"
    asset_class: "Cryptocurrency"
    strategy: "trend_following"
    risk_limit: 0.05
    capital_allocation: 50000
    # What this desk's venue really charges, per side, in basis points.
    #
    # These are **Alpaca crypto** rates, which is where this village trades.
    # An earlier version of this block used Coinbase's 0.6% — a number that
    # came from a dossier about a different bot on a different exchange, and
    # had no business here. Alpaca's crypto tier is roughly 0.25% a side for
    # retail volume; equities are commission-free, which is why the other
    # desks carry no override at all.
    #
    # The fee stands; the slippage was a guess and is now a measurement.
    # Median half-spread from Alpaca crypto quotes, 2026-09-11 15:00-16:00Z,
    # 1,000 quotes per symbol: BTC 1.51 bps a side, ETH 2.31, SOL 5.32. The
    # 10 assumed here was between 2x and 7x those. Taking the widest of the
    # three rather than the median, because a desk that trades all three
    # should not be told the cheapest one is typical.
    costs:
      fee_bps: 25
      slippage_bps: 5.3
    universe: [BTC-USD, ETH-USD, SOL-USD]
    analysts: [technical, sentiment, onchain]
    genome:
      fast_window: 6
      slow_window: 21
      rsi_window: 10
      trend_bias: 85
      value_window: 45
      fair_band_pct: 15
      calm_vol_pct: 60

  # ---------------------------------------------------------------------
  # Five more, so the village is a village rather than a trio — and so the
  # leaderboard, the arena and the solar system have something to rank.
  #
  # They differ in *genome*, not in code: the analysts are the same, and what
  # separates them is how they read the same bars. That is the point of the
  # comparison — same data, same rules, different parameters, and the ledger
  # decides which was right.
  # ---------------------------------------------------------------------
  firm_d_value:
    name: "Value Desk"
    asset_class: "Equities"
    strategy: "mean_reversion"
    risk_limit: 0.02
    capital_allocation: 80000
    universe: [JNJ, KO, XOM, PG, VZ]
    analysts: [fundamental, technical, signals, news, scribe]
    genome:
      fast_window: 20
      slow_window: 90
      rsi_window: 21
      trend_bias: 15          # buys weakness rather than strength
      value_window: 140
      fair_band_pct: 14
      calm_vol_pct: 20

  firm_e_momentum:
    name: "Momentum Desk"
    asset_class: "Equities"
    strategy: "breakout"
    risk_limit: 0.04
    capital_allocation: 80000
    universe: [NVDA, TSLA, AMD, META, AMZN]
    analysts: [technical, sentiment]
    genome:
      fast_window: 5
      slow_window: 20
      rsi_window: 9
      trend_bias: 95          # nearly pure momentum
      value_window: 40
      fair_band_pct: 20
      calm_vol_pct: 70

  firm_f_bonds:
    name: "Rates Desk"
    asset_class: "Fixed income"
    strategy: "carry"
    risk_limit: 0.01          # the quiet one
    capital_allocation: 60000
    universe: [TLT, IEF, SHY, LQD]
    analysts: [fundamental, macro, signals, news, scribe]
    genome:
      fast_window: 25
      slow_window: 110
      rsi_window: 28
      trend_bias: 40
      value_window: 150
      fair_band_pct: 4
      calm_vol_pct: 15

  firm_g_commodities:
    name: "Commodities Desk"
    asset_class: "Commodities"
    strategy: "trend_following"
    risk_limit: 0.03
    capital_allocation: 70000
    universe: [GLD, SLV, USO, DBA]
    analysts: [technical, macro, signals, news, scribe]
    genome:
      fast_window: 9
      slow_window: 45
      rsi_window: 14
      trend_bias: 75
      value_window: 100
      fair_band_pct: 11
      calm_vol_pct: 50

  firm_h_global:
    name: "Global Macro"
    asset_class: "Multi-asset"
    strategy: "macro"
    risk_limit: 0.025
    capital_allocation: 60000
    universe: [EFA, EEM, FXI, EWJ, VGK]
    analysts: [macro, fundamental, sentiment]
    genome:
      fast_window: 15
      slow_window: 70
      rsi_window: 18
      trend_bias: 50          # no opinion; lets the evidence decide
      value_window: 110
      fair_band_pct: 9
      calm_vol_pct: 35

  firm_i_memecoins:
    name: "Meme Desk"
    asset_class: "Cryptocurrency"
    strategy: "momentum"
    # The riskiest mandate in the village, and the limits say so: a third of
    # the risk per trade of the crypto desk, and a kill switch it will trip
    # long before the others would. A meme coin is not a small equity; it is a
    # different distribution, and pretending otherwise is how a book gets
    # emptied by one name.
    risk_limit: 0.015
    capital_allocation: 30000
    # Same Alpaca crypto fee as firm_c_crypto, and a genuinely wider spread —
    # but the 35 assumed here was still nearly twice the real one. Measured
    # 2026-09-11 15:00-16:00Z, 1,000 quotes each: DOGE 19.64 bps a side,
    # WIF 19.65. Thin books, confirmed: 13x BTC's spread and 4x SOL's. The
    # assumption was right about the shape and wrong about the size.
    #
    # This one matters more than the others. It is the blocker on testing
    # whether explicit crowd signals predict anything on these names: the
    # research effect is strongest exactly on low-cap, recently-negative
    # assets, and at 60 a side a real signal would have had to clear 120 bps
    # round trip to show up at all. The true bar is 39.
    costs:
      fee_bps: 25
      slippage_bps: 19.7
    universe: [DOGE-USD, SHIB-USD, PEPE-USD, WIF-USD]
    analysts: [technical, sentiment, onchain]
    genome:
      fast_window: 4
      slow_window: 18
      rsi_window: 8
      trend_bias: 92          # almost pure momentum; these do not mean-revert
      value_window: 35
      fair_band_pct: 24       # "fair value" is close to meaningless here
      calm_vol_pct: 85        # nothing about this is calm

# =========================================================================
# The scanners — bots that spot things instead of trading them.
#
# A screener, a ranker, a whale watcher: anything that reads the market and
# names a symbol without wanting to place an order. Each one runs once per
# market bar and publishes a reading — a score from -100 to +100 and a
# confidence from 0 to 100 — which any firm listing the `signals` analyst
# hears in its debate. See bots/example_scanner.py and src/trading/signals.py.
#
# A scanner cannot move money. Its score is one vote at one seat, and the
# resulting proposal still meets the risk manager, the conscience, the venue
# and the approval gate. That is why running somebody else's screener is a
# smaller decision than running their strategy.
#
# A reading is only heard on the bar it was published for, so a scanner that
# stops running goes silent immediately rather than voting from the grave.
#
# One is registered below so the seat is visibly working rather than working
# once you find the switch. Delete the block for a village with no scanners.
#
# **Four firms listen, not one.** This block used to say `firm_a_etf` was the
# only one; `signals` is on the analyst list of `firm_a_etf`, `firm_d_value`,
# `firm_f_bonds` and `firm_g_commodities`. That matters because it is the blast
# radius of registering a scanner, and it was understated by 4x — one of the
# listeners is `firm_g_commodities`, currently the firm nearest the promotion
# gate. A scanner registered here is heard by all four on the bar it publishes.
#
# The only scanner registered is `example`, a demonstration. Every row in the
# `signals` table with publisher `example` comes from it — so the village has
# never run a real screener, and nothing has ever published a reading drawn
# from live market structure.
# =========================================================================
scanners:
  example:
    bot: bots/example_scanner.py
  # The live fleet, heard rather than re-implemented. fleet_sync (on a machine
  # logged in to Railway) and the worker's once-a-bar account read put their
  # output in the ledger; these read it. Each is silent when its data is stale.
  fleet_scanner:
    bot: bots/fleet_scanner.py
  fleet_form4:
    bot: bots/fleet_form4.py
  fleet_book:
    bot: bots/fleet_book.py
  fleet_positions:
    bot: bots/fleet_positions.py
  # Explicit calls from the YouTube channels in config/video_channels.yaml,
  # read by scripts/video_watch.py on the operator's PC.
  video_calls:
    bot: bots/video_calls.py
    # universe: [SPY, QQQ, IWM]   # optional — defaults to the whole village
