# Instagram accounts the village account follows and reads (scripts/insta_watch.py).
#
# Following is how the account's own feed learns what to show: these seed the
# algorithm with markets, trading and crypto, and the reader also scrolls the
# home feed, so what Instagram recommends after that becomes a source too.
#
# Every handle is checked in the browser before it is followed; one that does
# not resolve is reported and skipped, never guessed at. `verified: false` means
# not yet checked. Edit freely: add handles, delete ones that turn out noisy.
accounts:
  # market news
  - {handle: cnbc, group: news}
  - {handle: bloombergbusiness, group: news}
  - {handle: wsj, group: news}
  - {handle: reuters, group: news}
  - {handle: yahoofinance, group: news}
  - {handle: financialtimes, group: news}
  - {handle: businessinsider, group: news}
  - {handle: marketwatch, group: news}
  # charts and education
  - {handle: tradingview, group: trading}
  - {handle: investopedia, group: trading}
  - {handle: stocktwits, group: trading}
  - {handle: unusual_whales, group: trading}
  - {handle: daytrading, group: trading}      # suggested by the operator
  # crypto
  - {handle: coindesk, group: crypto}
  - {handle: cointelegraph, group: crypto}
  - {handle: binance, group: crypto}
  - {handle: coinbase, group: crypto}
  - {handle: solana, group: crypto}
  - {handle: bitcoinmagazine, group: crypto}
  # memes
  - {handle: dogecoin, group: memes}
  - {handle: pepecoineth, group: memes}
  # From the accounts @daytrading follows (operator's suggestion, 2026-09-27)
  - {handle: hedgefundinvestor, group: trading}
  - {handle: stockstoearn, group: trading}
  - {handle: wallstreetintern, group: trading}
  - {handle: litquidity, group: trading}
  - {handle: stocksharks, group: trading}
  - {handle: charan.invests, group: trading}
  - {handle: portfoliobreakdown, group: trading}
  - {handle: wehavethedata, group: trading}
  - {handle: wealth, group: trading}
  - {handle: richkleiman, group: trading}
  - {handle: publicapp, group: trading}
  - {handle: notjeromepowell, group: trading}
  - {handle: tryfomo, group: memes}
  - {handle: orangieyt, group: memes}
  - {handle: coingrams, group: crypto}
  - {handle: watcher.guru, group: news}
  - {handle: polymarket, group: prediction}
  - {handle: polymarketmoney, group: prediction}
  - {handle: artificialintelligenceee, group: ai}
  - {handle: ycombinator, group: ai}
  - {handle: mytechceo, group: ai}
  - {handle: lovable.dev, group: ai}
  - {handle: robotic, group: ai}
  - {handle: 1x.technologies, group: ai}

# Follows per run while seeding, and seconds between them. A new account that
# follows twenty accounts in a minute looks like what it is.
follows_per_run: 4
follow_pause_s: 45

# Posts read per profile per run, and calls older than this stop voting.
posts_per_profile: 6
max_age_hours: 24

# For You: after the home feed, scroll what Instagram picks for the account
# rather than who it follows. Reels are watched one at a time with a pause of
# for_you_dwell_s (a random number of seconds in that range) on each; Explore
# is a grid, scrolled a few times. Read only: nothing there is liked or
# followed. 0 turns either off. A For You post is kept only if it is about
# markets or makes a call.
for_you_reels: 15
for_you_explore: 12
for_you_dwell_s: [4, 9]

# Reels are heard, not just read: at most this many new reels a run have their
# audio transcribed by the local Whisper model, up to max_video_s of each.
reels_heard_per_run: 20
max_video_s: 600
